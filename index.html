<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스도쿠</title>
<style>
  :root {
    --accent: #3b6fd6;
    --accent-light: #eaf1fd;
    --border-dark: #333;
    --border-light: #ccc;
    --bg: #f7f8fa;
    --text: #222;
    --wrong: #e25555;
    --correct: #2e9e5b;
    --peer: #eef2fb;
    --hint: #2e9e5b;
    --cell-size: 44px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 20px;
    letter-spacing: -0.02em;
  }
  .panel {
    background: #fff;
    border: 1px solid #e3e5e9;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    width: 100%;
    max-width: 480px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .control-row:last-child { margin-bottom: 0; }
  .control-label {
    width: 64px;
    font-size: 0.92rem;
    color: #555;
    flex-shrink: 0;
  }
  .btn-group {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .toggle-btn {
    flex: 1;
    padding: 8px 0;
    border: 1px solid var(--border-light);
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.92rem;
    color: #444;
    transition: all 0.12s ease;
  }
  .toggle-btn:hover { border-color: var(--accent); }
  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .main-area {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }

  #board-wrap {
    display: inline-block;
    background: var(--border-dark);
    padding: 3px;
    border-radius: 4px;
  }
  #board {
    display: grid;
    gap: 1px;
    background: var(--border-dark);
  }
  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    text-align: center;
    font-size: calc(var(--cell-size) * 0.42);
    border: none;
    outline: none;
    background: #fff;
    font-family: inherit;
    color: var(--accent);
    font-weight: 600;
    padding: 0;
    -moz-appearance: textfield;
  }
  .cell::-webkit-outer-spin-button,
  .cell::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cell.given {
    background: #f0f1f3;
    color: #222;
  }
  .cell.hint {
    color: var(--hint);
  }
  .cell.peer {
    background: var(--peer);
  }
  .cell.selected {
    background: #cfe0fb;
    box-shadow: inset 0 0 0 2px var(--accent);
    z-index: 1;
    position: relative;
  }
  .cell.wrong {
    background: #fdeaea;
    color: var(--wrong);
  }
  .cell.box-right { border-right: 2.5px solid var(--border-dark); }
  .cell.box-bottom { border-bottom: 2.5px solid var(--border-dark); }

  #side-panel {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .icon-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .icon-btn {
    position: relative;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px solid #e3e5e9;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.25rem;
    color: #555;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .icon-btn .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--accent);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  #keypad button {
    padding: 14px 0;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
    background: #eef1f7;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #keypad button:hover { background: var(--accent-light); }
  #keypad button:disabled { opacity: 0.3; cursor: not-allowed; }

  .action-btn {
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 0.98rem;
    cursor: pointer;
    font-weight: 700;
    width: 100%;
  }
  .panel .action-btn { margin-top: 4px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2f5cb8; }
  .btn-secondary { background: #eef0f3; color: #333; }
  .btn-secondary:hover { background: #e2e5ea; }

  #message {
    margin-top: 20px;
    min-height: 24px;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
  }
  #message.ok { color: var(--correct); }
  #message.bad { color: var(--wrong); }

  @media (max-width: 560px) {
    #side-panel { width: 100%; max-width: 320px; }
  }
</style>
</head>
<body>
  <h1>스도쿠</h1>

  <div class="panel">
    <div class="control-row">
      <span class="control-label">크기</span>
      <div class="btn-group" id="size-group">
        <button class="toggle-btn active" data-size="6">6 × 6</button>
        <button class="toggle-btn" data-size="9">9 × 9</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">난이도</span>
      <div class="btn-group" id="difficulty-group">
        <button class="toggle-btn active" data-diff="easy">하</button>
        <button class="toggle-btn" data-diff="medium">중</button>
        <button class="toggle-btn" data-diff="hard">상</button>
      </div>
    </div>
    <button class="action-btn btn-primary" id="new-btn">새 문제 만들기</button>
  </div>

  <div class="main-area">
    <div id="board-wrap">
      <div id="board"></div>
    </div>

    <div id="side-panel">
      <div class="icon-row">
        <button class="icon-btn" id="reset-btn" title="처음부터 다시 풀기">&#8635;</button>
        <button class="icon-btn" id="erase-btn" title="선택한 칸 지우기">&#9003;</button>
        <button class="icon-btn" id="hint-btn" title="힌트 보기">
          &#128161;
          <span class="badge" id="hint-badge">2</span>
        </button>
      </div>
      <div id="keypad"></div>
      <button class="action-btn btn-primary" id="check-btn">채점하기</button>
    </div>
  </div>

  <div id="message"></div>

<script>
(function () {
  const TARGETS = {
    6: { easy: 12, medium: 18, hard: 23 },
    9: { easy: 36, medium: 45, hard: 51 },
  };
  const MAX_HINTS = 2;

  let state = {
    size: 6,
    difficulty: 'easy',
    solved: null,
    puzzle: null,
    selected: null,
    hintsRemaining: MAX_HINTS,
  };

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function makeEmptyGrid(size) {
    return Array.from({ length: size }, () => Array(size).fill(0));
  }

  function boxDims(size) {
    return { boxH: size === 9 ? 3 : 2, boxW: 3 };
  }

  function isValid(grid, size, boxH, boxW, row, col, num) {
    for (let c = 0; c < size; c++) if (grid[row][c] === num) return false;
    for (let r = 0; r < size; r++) if (grid[r][col] === num) return false;
    const br = Math.floor(row / boxH) * boxH;
    const bc = Math.floor(col / boxW) * boxW;
    for (let r = br; r < br + boxH; r++)
      for (let c = bc; c < bc + boxW; c++)
        if (grid[r][c] === num) return false;
    return true;
  }

  function findEmpty(grid, size) {
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        if (grid[r][c] === 0) return [r, c];
    return null;
  }

  function fillGrid(grid, size, boxH, boxW) {
    const pos = findEmpty(grid, size);
    if (!pos) return true;
    const [r, c] = pos;
    const nums = shuffle([...Array(size)].map((_, i) => i + 1));
    for (const num of nums) {
      if (isValid(grid, size, boxH, boxW, r, c, num)) {
        grid[r][c] = num;
        if (fillGrid(grid, size, boxH, boxW)) return true;
        grid[r][c] = 0;
      }
    }
    return false;
  }

  function countSolutions(grid, size, boxH, boxW, limit) {
    const pos = findEmpty(grid, size);
    if (!pos) return 1;
    const [r, c] = pos;
    let total = 0;
    for (let num = 1; num <= size; num++) {
      if (isValid(grid, size, boxH, boxW, r, c, num)) {
        grid[r][c] = num;
        total += countSolutions(grid, size, boxH, boxW, limit - total);
        grid[r][c] = 0;
        if (total >= limit) return total;
      }
    }
    return total;
  }

  function generatePuzzle(size, difficulty) {
    const { boxH, boxW } = boxDims(size);
    const solved = makeEmptyGrid(size);
    fillGrid(solved, size, boxH, boxW);
    const puzzle = solved.map((row) => row.slice());
    const cells = [];
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) cells.push([r, c]);
    shuffle(cells);
    const target = TARGETS[size][difficulty];
    let removed = 0;
    for (const [r, c] of cells) {
      if (removed >= target) break;
      const backup = puzzle[r][c];
      puzzle[r][c] = 0;
      const copy = puzzle.map((row) => row.slice());
      const count = countSolutions(copy, size, boxH, boxW, 2);
      if (count === 1) {
        removed++;
      } else {
        puzzle[r][c] = backup;
      }
    }
    return { solved, puzzle };
  }

  function getCellEl(r, c) {
    return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
  }

  function computeCellSize() {
    const { size } = state;
    const maxBoardWidth = Math.min(window.innerWidth - 32, 460);
    const raw = Math.floor(maxBoardWidth / size);
    const cellSize = Math.max(30, Math.min(46, raw));
    document.documentElement.style.setProperty('--cell-size', cellSize + 'px');
  }

  function renderBoard() {
    const { size, puzzle } = state;
    const { boxH, boxW } = boxDims(size);
    computeCellSize();
    const board = document.getElementById('board');
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${size}, var(--cell-size))`;
    board.style.gridTemplateRows = `repeat(${size}, var(--cell-size))`;

    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const input = document.createElement('input');
        input.className = 'cell';
        input.setAttribute('inputmode', 'none');
        input.maxLength = 1;
        input.dataset.row = r;
        input.dataset.col = c;

        if ((c + 1) % boxW === 0 && c !== size - 1) input.classList.add('box-right');
        if ((r + 1) % boxH === 0 && r !== size - 1) input.classList.add('box-bottom');

        const val = puzzle[r][c];
        if (val !== 0) {
          input.value = val;
          input.readOnly = true;
          input.classList.add('given');
        } else {
          input.addEventListener('input', (e) => {
            const raw = e.target.value.replace(/[^0-9]/g, '');
            let num = raw ? parseInt(raw, 10) : '';
            if (num !== '' && (num < 1 || num > size)) num = '';
            e.target.value = num;
            e.target.classList.remove('wrong');
          });
        }
        input.addEventListener('focus', () => selectCell(r, c));
        board.appendChild(input);
      }
    }
  }

  function renderKeypad() {
    const { size } = state;
    const keypad = document.getElementById('keypad');
    keypad.innerHTML = '';
    for (let n = 1; n <= size; n++) {
      const btn = document.createElement('button');
      btn.textContent = n;
      btn.addEventListener('click', () => enterNumber(n));
      keypad.appendChild(btn);
    }
  }

  function selectCell(r, c) {
    state.selected = { r, c };
    updateHighlight();
  }

  function updateHighlight() {
    const { size, selected } = state;
    const { boxH, boxW } = boxDims(size);
    document.querySelectorAll('.cell').forEach((cell) => {
      cell.classList.remove('selected', 'peer');
    });
    if (!selected) return;
    const { r, c } = selected;
    const br = Math.floor(r / boxH) * boxH;
    const bc = Math.floor(c / boxW) * boxW;
    for (let i = 0; i < size; i++) {
      const rowPeer = getCellEl(r, i);
      const colPeer = getCellEl(i, c);
      if (rowPeer) rowPeer.classList.add('peer');
      if (colPeer) colPeer.classList.add('peer');
    }
    for (let rr = br; rr < br + boxH; rr++) {
      for (let cc = bc; cc < bc + boxW; cc++) {
        const boxPeer = getCellEl(rr, cc);
        if (boxPeer) boxPeer.classList.add('peer');
      }
    }
    const cur = getCellEl(r, c);
    if (cur) cur.classList.add('selected');
  }

  function enterNumber(num) {
    if (!state.selected) return;
    const { r, c } = state.selected;
    const cell = getCellEl(r, c);
    if (!cell || cell.readOnly) return;
    cell.value = num;
    cell.classList.remove('wrong');
  }

  function eraseSelected() {
    if (!state.selected) return;
    const { r, c } = state.selected;
    const cell = getCellEl(r, c);
    if (!cell || cell.classList.contains('given')) return;
    cell.value = '';
    cell.readOnly = false;
    cell.classList.remove('wrong', 'hint');
  }

  function useHint() {
    if (state.hintsRemaining <= 0) return;
    const { size, solved } = state;
    let target = null;
    if (state.selected) {
      const { r, c } = state.selected;
      const cell = getCellEl(r, c);
      if (cell && !cell.readOnly && !cell.value) target = { r, c };
    }
    if (!target) {
      const candidates = [];
      document.querySelectorAll('.cell').forEach((cell) => {
        if (!cell.readOnly && !cell.value) {
          candidates.push({ r: parseInt(cell.dataset.row, 10), c: parseInt(cell.dataset.col, 10) });
        }
      });
      if (candidates.length === 0) {
        setMessage('힌트로 알려줄 빈 칸이 없어요.', 'bad');
        return;
      }
      target = candidates[Math.floor(Math.random() * candidates.length)];
    }
    const cell = getCellEl(target.r, target.c);
    cell.value = solved[target.r][target.c];
    cell.readOnly = true;
    cell.classList.remove('wrong');
    cell.classList.add('hint');
    state.hintsRemaining--;
    updateHintBadge();
  }

  function updateHintBadge() {
    const badge = document.getElementById('hint-badge');
    const hintBtn = document.getElementById('hint-btn');
    badge.textContent = state.hintsRemaining;
    hintBtn.disabled = state.hintsRemaining <= 0;
  }

  function newPuzzle() {
    const { size, difficulty } = state;
    const { solved, puzzle } = generatePuzzle(size, difficulty);
    state.solved = solved;
    state.puzzle = puzzle;
    state.selected = null;
    state.hintsRemaining = MAX_HINTS;
    setMessage('', '');
    renderBoard();
    renderKeypad();
    updateHintBadge();
  }

  function checkPuzzle() {
    const { size, solved, puzzle } = state;
    const cells = document.querySelectorAll('.cell');
    let wrongCount = 0;
    let filledCount = 0;
    cells.forEach((cell) => {
      if (cell.classList.contains('given') || cell.classList.contains('hint')) return;
      const r = parseInt(cell.dataset.row, 10);
      const c = parseInt(cell.dataset.col, 10);
      const val = cell.value ? parseInt(cell.value, 10) : 0;
      cell.classList.remove('wrong');
      if (val !== 0) {
        filledCount++;
        if (val !== solved[r][c]) {
          cell.classList.add('wrong');
          wrongCount++;
        }
      }
    });
    const totalGivenLike = document.querySelectorAll('.cell.given, .cell.hint').length;
    const totalBlank = size * size - totalGivenLike;
    if (filledCount < totalBlank) {
      setMessage(`아직 ${totalBlank - filledCount}칸이 비어 있어요.`, 'bad');
    } else if (wrongCount === 0) {
      setMessage('정답이에요! 참 잘했어요.', 'ok');
    } else {
      setMessage(`틀린 칸이 ${wrongCount}개 있어요. 빨간 칸을 다시 확인해보세요.`, 'bad');
    }
  }

  function resetPuzzle() {
    document.querySelectorAll('.cell').forEach((cell) => {
      if (!cell.classList.contains('given')) {
        cell.value = '';
        cell.readOnly = false;
        cell.classList.remove('wrong', 'hint');
      }
    });
    state.hintsRemaining = MAX_HINTS;
    updateHintBadge();
    setMessage('', '');
  }

  function setMessage(text, cls) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = cls;
  }

  document.getElementById('size-group').addEventListener('click', (e) => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    document.querySelectorAll('#size-group .toggle-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.size = parseInt(btn.dataset.size, 10);
    newPuzzle();
  });

  document.getElementById('difficulty-group').addEventListener('click', (e) => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    document.querySelectorAll('#difficulty-group .toggle-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.difficulty = btn.dataset.diff;
    newPuzzle();
  });

  document.getElementById('new-btn').addEventListener('click', newPuzzle);
  document.getElementById('check-btn').addEventListener('click', checkPuzzle);
  document.getElementById('reset-btn').addEventListener('click', resetPuzzle);
  document.getElementById('erase-btn').addEventListener('click', eraseSelected);
  document.getElementById('hint-btn').addEventListener('click', useHint);

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(computeCellSize, 100);
  });

  newPuzzle();
})();
</script>
</body>
</html>
